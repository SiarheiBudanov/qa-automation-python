name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests - ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chrome
          - firefox
          - edge

    env:
      CI: true
      BROWSER: ${{ matrix.browser }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Install Edge
        if: matrix.browser == 'edge'
        uses: browser-actions/setup-edge@v1

      - name: Run API tests
        run: |
          pytest tests/api \
            --junitxml=test-results-${{ matrix.browser }}.xml \
            --html=api-report-${{ matrix.browser }}.html \
            --self-contained-html \
            -p no:cacheprovider

      - name: Run UI tests
        run: |
          pytest tests/ui \
            --junitxml=ui-results-${{ matrix.browser }}.xml \
            --html=ui-report-${{ matrix.browser }}.html \
            --self-contained-html \
            -p no:cacheprovider

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.browser }}
          path: |
            *-results-${{ matrix.browser }}.xml
            *-report-${{ matrix.browser }}.html
            reports/
          if-no-files-found: ignore